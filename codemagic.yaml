workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Prepare Flutter project
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name freelance_project_finder .
          fi
          flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
